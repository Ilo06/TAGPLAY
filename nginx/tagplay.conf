# Place in /etc/nginx/sites-available/tagplay.conf and symlink into sites-enabled/.
# certbot (--nginx) will add the HTTPS server block and the HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name tagplay.duckdns.org;

    # Must match MAX_UPLOAD_BYTES in src/app.ts, otherwise nginx answers 413 first.
    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream uploads straight to Node instead of buffering the whole file in nginx.
        proxy_request_buffering off;

        # Stream video responses as they come. Range headers are passed through
        # untouched (do not set or strip them here): iPhone/Safari needs them.
        proxy_buffering off;

        # Large uploads over a slow connection can take a while.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
